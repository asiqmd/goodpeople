name: CodeQL

# Static analysis of the API and web code for security problems (injection, path traversal,
# unsafe redirects and the like); findings appear under the repository's Security tab.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 2 * * 0'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
