name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    env:
      GP_ENTERPRISE_DRILLS: 'on'
    services:
      redis:
        image: redis:7.4
        ports: ['6381:6379']
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Official PGDG repository/key; the native recovery rehearsal needs v17 dump/restore clients.
      # https://www.postgresql.org/download/linux/ubuntu/
      - name: Install PostgreSQL 17 recovery clients
        shell: bash
        run: |
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/pgdg.asc"
          gp_pgdg_fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/pgdg.asc" | awk -F: '$1=="fpr" {print $10; exit}')
          test "$gp_pgdg_fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo install -m 0644 "$RUNNER_TEMP/pgdg.asc" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" > "$RUNNER_TEMP/pgdg.sources"
          sudo install -m 0644 "$RUNNER_TEMP/pgdg.sources" /etc/apt/sources.list.d/pgdg.sources
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - run: cp .env.example .env
      - run: pnpm build
      - run: pnpm db:setup
      - run: pnpm lint
      - run: pnpm typecheck
      # Unit tests plus API end-to-end tests against good_people_test, including the
      # row-level security isolation checks and the subscription-bypass flow.
      - run: pnpm test

  # Known vulnerabilities in the dependencies that ship: fails on high or critical advisories.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Builds the production images (nothing is pushed) and smoke-tests them the way
  # infra/docker-compose.prod.yml runs them: setup and migrations from the API image, the API's
  # /health, a PDF through the non-root Chromium wrapper, and the web app's sign-in page.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: good-people-api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          tags: good-people-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Smoke-test the images
        run: |
          retry() { for _ in $(seq 1 30); do "$@" && return 0; sleep 2; done; return 1; }
          get() { echo "fetch('$1').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"; }
          owner=postgres://gp_owner:owner-ci@postgres:5432/good_people
          app=postgres://gp_app:app-ci@postgres:5432/good_people
          hardening=(--cap-drop ALL --security-opt no-new-privileges:true)

          docker network create gp
          docker run -d --name redis --network gp redis:7.4
          docker run -d --name postgres --network gp -e POSTGRES_PASSWORD=postgres postgres:17
          retry docker exec postgres pg_isready -h 127.0.0.1 -U postgres

          docker run --rm --network gp "${hardening[@]}" \
            -e DATABASE_ADMIN_URL=postgres://postgres:postgres@postgres:5432/postgres \
            -e DATABASE_OWNER_URL="$owner" -e DATABASE_URL="$app" \
            good-people-api:ci node node_modules/@gp/db/dist/scripts/setup.js
          docker run --rm --network gp "${hardening[@]}" -e DATABASE_OWNER_URL="$owner" \
            good-people-api:ci node node_modules/@gp/db/dist/scripts/migrate.js

          access_secret=$(openssl rand -base64 48)
          field_key=$(openssl rand -base64 32)
          # No mail or SMS provider in CI: the log drivers, which production otherwise refuses.
          docker run -d --name api --network gp "${hardening[@]}" \
            -e DATABASE_URL="$app" -e REDIS_URL=redis://redis:6379 -e BACKGROUND_JOBS=off -e ALLOW_LOG_SENDERS=on \
            -e JWT_ACCESS_SECRET="$access_secret" \
            -e FIELD_ENCRYPTION_KEY="$field_key" \
            good-people-api:ci
          retry docker exec api node -e "$(get http://127.0.0.1:4000/health)"

          # Separate worker, shared keys/state, no HTTP listener.
          docker run -d --name worker --network gp "${hardening[@]}" \
            -e DATABASE_URL="$app" -e REDIS_URL=redis://redis:6379 -e BACKGROUND_JOBS=on -e PROCESS_ROLE=worker -e ALLOW_LOG_SENDERS=on \
            -e JWT_ACCESS_SECRET="$access_secret" -e FIELD_ENCRYPTION_KEY="$field_key" \
            good-people-api:ci node dist/worker.js
          retry docker exec worker node --input-type=module -e '
            import {createDb} from "@gp/db";
            const {pool}=createDb(process.env.DATABASE_URL);
            try {const {rows}=await pool.query("select count(*)::int n from job_leases where heartbeat_at > now() - make_interval(mins=>2) and ok=true");if(!rows[0].n)process.exitCode=1;}
            finally{await pool.end();}
          '

          # Chromium as the API starts it when not root: CHROME_PATH (the --no-sandbox wrapper).
          docker exec api node --input-type=module -e "
            import puppeteer from 'puppeteer-core';
            if (process.getuid() === 0) throw new Error('the API image runs as root');
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME_PATH, headless: true, args: ['--disable-gpu'],
            });
            const page = await browser.newPage();
            await page.setContent('<p>Good People</p>');
            const pdf = Buffer.from(await page.pdf());
            await browser.close();
            if (pdf.subarray(0, 5).toString() !== '%PDF-') throw new Error('not a PDF');
            console.log('PDF rendered:', pdf.length, 'bytes as uid', process.getuid());
          "

          docker run -d --name web --network gp --init "${hardening[@]}" \
            -e API_URL=http://api:4000 good-people-web:ci
          retry docker exec web node -e "$(get http://127.0.0.1:3000/login)"
      - name: Container logs
        if: failure()
        run: for c in postgres redis api worker web; do echo "::group::$c"; docker logs "$c" || true; echo "::endgroup::"; done
