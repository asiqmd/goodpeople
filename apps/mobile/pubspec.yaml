name: good_people
description: "Good People mobile app: HR and payroll for teams in Bangladesh."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.8
  dio: ^5.11.1
  # Push notifications. Set up from --dart-defines (see FirebaseConfig), so
  # there is no google-services.json or GoogleService-Info.plist; without
  # them push is off.
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  geolocator: ^14.1.2
  # The front camera for selfie punches.
  image_picker: ^1.2.4
  # Pinned by flutter_localizations; `any` lets the Flutter SDK choose.
  intl: any
  # Opens a downloaded PDF in the phone's own viewer.
  open_filex: ^5.0.0
  # The app's cache directory, where that PDF is saved first, and its
  # support directory, where punches taken offline wait to be sent.
  path_provider: ^2.1.6
  # Opens an interview's video call link in the browser or the meeting app.
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # Runs `flutter gen-l10n` (configured in l10n.yaml) on pub get and build.
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/OFL-NotoSansArabic.txt
  fonts:
    - family: GPArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
