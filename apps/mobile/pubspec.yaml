name: good_people
description: "Good People mobile app: HR and payroll for teams in Bangladesh."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  # Pinned by flutter_localizations; `any` lets the Flutter SDK choose.
  geolocator: ^14.1.2
  intl: any

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # Runs `flutter gen-l10n` (configured in l10n.yaml) on pub get and build.
  generate: true
  uses-material-design: true
