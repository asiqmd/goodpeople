# Local services for teammates who use Docker. With this, set in .env:
#   DATABASE_ADMIN_URL=postgres://postgres:postgres@localhost:5432/postgres
# Redis, MinIO and Mailpit are not used by Phase 0 code yet; they are here so
# Phase 1 (queues, documents, email) starts from the same setup.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ['6379:6379']
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-dev-password
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]
  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']
volumes:
  pgdata:
  miniodata:
